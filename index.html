<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ecos de Evermore — Alquimia &amp; Ceniza</title>
<style>
  html,body{margin:0;height:100%;background:#07060a;overflow:hidden;
    font-family:ui-monospace,Consolas,monospace;color:#cbb;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#120e18 0%,#050408 70%);}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 1px #1c1626, 0 24px 80px rgba(0,0,0,.9), 0 0 90px rgba(120,60,200,.10);
    background:#000;cursor:crosshair;}
  #hint{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:11px;
    color:#4a3f5c;letter-spacing:.18em;pointer-events:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#07060a;color:#8b6ad6;font-size:13px;letter-spacing:.3em;z-index:5;
    transition:opacity .4s;pointer-events:none}
  #boot.hide{opacity:0}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<div id="boot">DESPERTANDO EL ECO…</div>
<div id="hint">WASD mover · RATÓN apuntar · CLIC atacar · ESPACIO esquivar · TAB alquimia · ESC pausa</div>

<script src="src/core.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/gfx.js"></script>
<script src="src/art.js"></script>
<script src="src/nara.js"></script>
<script src="src/rig.js"></script>
<script src="src/alchemy.js"></script>
<script src="src/hero.js"></script>
<script src="src/dog.js"></script>
<script src="src/foes.js"></script>
<script src="src/world.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
